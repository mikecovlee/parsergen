# CI for parsergen (Covariant Script Parser Generator)
#
# This CI:
#   1. Downloads a pre-built CovScript SDK from csbuild releases
#   2. Configures cspkg to use the bundled package repository
#   3. Installs remote dependencies (regex) and builds parsergen from local source
#   4. Runs unit tests and integration tests
#   5. Builds the C++ implementation (libparsergen + parsergen_cxx.cse)
#   6. Runs C++ unit tests and drop-in replace tests

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]

    steps:
      # ------------------------------------------------------------------ #
      # 1. Check out this repo                                              #
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------------------ #
      # 2. Set platform identifiers                                         #
      # ------------------------------------------------------------------ #
      - name: Set platform identifiers
        id: platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   echo "os=ubuntu" >> "$GITHUB_OUTPUT"
                     echo "arch=x86_64" >> "$GITHUB_OUTPUT"
                     echo "cspkg_arch=amd64" >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "os=macos" >> "$GITHUB_OUTPUT"
                     echo "arch=arm64" >> "$GITHUB_OUTPUT"
                     echo "cspkg_arch=arm64" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "os=windows" >> "$GITHUB_OUTPUT"
                     echo "arch=x86_64" >> "$GITHUB_OUTPUT"
                     echo "cspkg_arch=amd64" >> "$GITHUB_OUTPUT" ;;
          esac

      # ------------------------------------------------------------------ #
      # 3. Download CovScript SDK + cspkg repository                        #
      # ------------------------------------------------------------------ #
      - name: Download CovScript SDK and cspkg repo
        id: sdk
        shell: bash
        run: |
          OS="${{ steps.platform.outputs.os }}"
          ARCH="${{ steps.platform.outputs.arch }}"
          BASE="https://github.com/covscript/csbuild/releases/download/${OS}-schedule"
          COV="covscript-${OS}-${ARCH}-nightly.7z"
          PKG="cspkg-${OS}-${ARCH}-nightly.7z"

          echo "Downloading ${COV}..."
          curl -fsSL -o covscript.7z "${BASE}/${COV}"
          echo "Downloading ${PKG}..."
          curl -fsSL -o cspkg.7z "${BASE}/${PKG}"

          7z x covscript.7z -y
          mv build covscript-home
          7z x cspkg.7z -y

          CS_HOME="${{ github.workspace }}/covscript-home"
          CS_HOME="${CS_HOME//\\//}"
          echo "cs_home=${CS_HOME}" >> "$GITHUB_OUTPUT"

          echo "=== covscript-home/bin ==="
          ls covscript-home/bin/

      # ------------------------------------------------------------------ #
      # 4. Configure cspkg                                                  #
      # ------------------------------------------------------------------ #
      - name: Configure cspkg
        shell: bash
        run: |
          mkdir -p "$HOME/.cspkg"

          CS_HOME="${{ steps.sdk.outputs.cs_home }}"
          WS="${{ github.workspace }}"
          WS="${WS//\\//}"

          if [[ "$WS" =~ ^[A-Za-z]:/ ]]; then
            SOURCE_URL="file:///${WS}/cspkg-repo/"
          else
            SOURCE_URL="file://${WS}/cspkg-repo/"
          fi

          cat > "$HOME/.cspkg/config.json" << EOF
          {
            "arch": "${{ steps.platform.outputs.cspkg_arch }}",
            "home": "${CS_HOME}",
            "source": "${SOURCE_URL}",
            "timeout_ms": 3000
          }
          EOF

          echo "=== cspkg config ==="
          cat "$HOME/.cspkg/config.json"

      # ------------------------------------------------------------------ #
      # 5. Setup environment                                                #
      # ------------------------------------------------------------------ #
      - name: Setup environment
        shell: bash
        run: |
          CS_HOME="${{ steps.sdk.outputs.cs_home }}"
          echo "COVSCRIPT_HOME=${CS_HOME}" >> "$GITHUB_ENV"
          echo "${CS_HOME}/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------ #
      # 6. Install remote dependencies + build local packages                #
      # ------------------------------------------------------------------ #
      - name: Install dependencies and build local packages
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod -R +x "$COVSCRIPT_HOME/bin/"
          fi
          # Install remote dependencies (regex, etc.)
          cspkg install --import --yes
          cspkg install --fix --yes
          echo ""
          echo "=== Installed packages ==="
          cspkg list

      # ------------------------------------------------------------------ #
      # 7. Run unit tests                                                   #
      # ------------------------------------------------------------------ #
      - name: Run unit tests
        shell: bash
        run: |
          echo "=== Unit Tests ==="
          fail=0
          for test in unit_tests/test_*.csc; do
            echo ""
            echo "--- $test ---"
            output=$(cs --import-path "${{ github.workspace }}" "$test" 2>&1) || true
            echo "$output"
            if echo "$output" | grep -q "Failed: 0"; then
              echo "  -> PASS"
            else
              echo "  -> FAIL (expected 'Failed: 0' in output)"
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo ""
            echo "=== SOME UNIT TESTS FAILED ==="
            exit 1
          fi
          echo ""
          echo "=== All unit tests passed ==="

      # ------------------------------------------------------------------ #
      # 8. Run integration tests                                            #
      # ------------------------------------------------------------------ #
      - name: Run integration tests
        shell: bash
        run: |
          echo "=== Integration Tests ==="
          fail=0
          for f in tests/test_cases/tiny/*.tny \
                   tests/test_cases/cminus/*.c- \
                   tests/test_cases/json/*.json \
                   tests/test_cases/ecs/*.ecs; do
            echo ""
            echo "--- $f ---"
            output=$(cs --import-path "${{ github.workspace }}" tests/run_parser.ecs "$f" 2>&1) || true
            echo "$output"
            if echo "$output" | grep -q "Compilation Error"; then
              echo "  -> FAIL"
              fail=1
            else
              echo "  -> PASS"
            fi
          done
          if [ $fail -ne 0 ]; then
            echo ""
            echo "=== SOME INTEGRATION TESTS FAILED ==="
            exit 1
          fi
          echo ""
          echo "=== All integration tests passed ==="

      # ------------------------------------------------------------------ #
      # 9. Run add_language / ast_dump scripts (pure CovScript path)        #
      # ------------------------------------------------------------------ #
      - name: Run pure CovScript scripts
        shell: bash
        run: |
          echo "=== Pure CovScript Scripts ==="
          # Combine the CSC parsergen (repo root) and ecs_parser (tests/) into a
          # single import dir so one --import-path resolves both (cross-platform
          # safe; avoids OS-specific path separators).
          mkdir -p cpp/test/pure_import
          cp parsergen.csp cpp/test/pure_import/
          cp tests/ecs_parser.csp cpp/test/pure_import/
          fail=0
          for script in "cpp/test/scripts/test_add_language.csc" \
                        "cpp/test/scripts/ast_dump_native.csc"; do
            echo ""
            echo "--- $script ---"
            output=$(cs --import-path cpp/test/pure_import "$script" tests/test_cases/ecs/v3.ecs 2>&1) || true
            echo "$output"
            if echo "$output" | grep -q "PARSE OK"; then
              echo "  -> PASS"
            else
              echo "  -> FAIL (expected 'PARSE OK' in output)"
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo ""
            echo "=== SOME SCRIPT TESTS FAILED ==="
            exit 1
          fi
          echo ""
          echo "=== All pure CovScript scripts passed ==="

  cxx:
    name: "C++ / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set platform identifiers
        id: platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   echo "os=ubuntu" >> "$GITHUB_OUTPUT"
                     echo "arch=x86_64" >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "os=macos" >> "$GITHUB_OUTPUT"
                     echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "os=windows" >> "$GITHUB_OUTPUT"
                     echo "arch=x86_64" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download CovScript SDK
        id: sdk
        shell: bash
        run: |
          OS="${{ steps.platform.outputs.os }}"
          ARCH="${{ steps.platform.outputs.arch }}"
          BASE="https://github.com/covscript/csbuild/releases/download/${OS}-schedule"
          COV="covscript-${OS}-${ARCH}-nightly.7z"

          echo "Downloading ${COV}..."
          curl -fsSL -o covscript.7z "${BASE}/${COV}"
          7z x covscript.7z -y
          mv build covscript-home

          CS_HOME="${{ github.workspace }}/covscript-home"
          CS_HOME="${CS_HOME//\\//}"
          echo "cs_home=${CS_HOME}" >> "$GITHUB_OUTPUT"

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Build C++ library and CNI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CS_DEV_PATH: ${{ steps.sdk.outputs.cs_home }}/
        run: |
          mkdir -p cmake-build/unix
          cd cmake-build/unix
          cmake -G "Unix Makefiles" ../../cpp
          cmake --build . --parallel 4

      - name: Build C++ library and CNI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          export PATH="${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin:${PATH}"
          export CS_DEV_PATH="$(cygpath -u "${{ steps.sdk.outputs.cs_home }}")/"
          mkdir -p cmake-build/mingw-w64
          cd cmake-build/mingw-w64
          cmake -G "MinGW Makefiles" ../../cpp
          cmake --build . --parallel 4

      - name: Run C++ unit tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./cmake-build/unix/parsergen_test

      - name: Run C++ unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & cmake-build\mingw-w64\parsergen_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run drop-in replace tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PARSERGEN_IMPL: parsergen_cxx
        run: |
          CS="${{ steps.sdk.outputs.cs_home }}/bin/cs"
          chmod +x "$CS"
          mkdir -p cpp/test/cxx_import
          cp cmake-build/unix/parsergen_cxx.cse cpp/test/cxx_import/
          cp tests/ecs_parser.csp cpp/test/cxx_import/
          "$CS" --import-path cpp/test/cxx_import cpp/test/scripts/test_dropin_all.csc

      - name: Run drop-in replace tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PARSERGEN_IMPL: parsergen_cxx
        run: |
          $cs = "${{ steps.sdk.outputs.cs_home }}\bin\cs.exe"
          New-Item -ItemType Directory -Force -Path cpp\test\cxx_import | Out-Null
          Copy-Item cmake-build\mingw-w64\parsergen_cxx.cse cpp\test\cxx_import\
          Copy-Item tests\ecs_parser.csp cpp\test\cxx_import\
          & $cs --import-path cpp\test\cxx_import cpp\test\scripts\test_dropin_all.csc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CNI script tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PARSERGEN_IMPL: parsergen_cxx
        run: |
          CS="${{ steps.sdk.outputs.cs_home }}/bin/cs"
          chmod +x "$CS"
          mkdir -p cpp/test/cxx_import
          cp cmake-build/unix/parsergen_cxx.cse cpp/test/cxx_import/
          cp tests/ecs_parser.csp cpp/test/cxx_import/

          echo "=== CNI Script Tests ==="
          fail=0
          run_test() {
            script="$1"; shift
            echo ""
            echo "--- $script ---"
            output=$("$CS" --import-path cpp/test/cxx_import "$script" 2>&1) || true
            echo "$output"
            for marker in "$@"; do
              if echo "$output" | grep -q "$marker"; then
                echo "  -> PASS ($marker)"
              else
                echo "  -> FAIL (missing '$marker')"
                fail=1
              fi
            done
          }
          run_test cpp/test/scripts/test_cni_add_language.csc "Failed 0"
          run_test cpp/test/scripts/test_partial_parser.csc "PARTIAL PARSER OK" "CLEAR HOOK OK"
          run_test cpp/test/scripts/test_typeid.csc "TYPEID OK"
          if [ $fail -ne 0 ]; then
            echo ""
            echo "=== SOME CNI SCRIPT TESTS FAILED ==="
            exit 1
          fi
          echo ""
          echo "=== All CNI script tests passed ==="

      - name: Run CNI script tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PARSERGEN_IMPL: parsergen_cxx
        run: |
          $cs = "${{ steps.sdk.outputs.cs_home }}\bin\cs.exe"
          New-Item -ItemType Directory -Force -Path cpp\test\cxx_import | Out-Null
          Copy-Item cmake-build\mingw-w64\parsergen_cxx.cse cpp\test\cxx_import\
          Copy-Item tests\ecs_parser.csp cpp\test\cxx_import\

          Write-Host "=== CNI Script Tests ==="
          $fail = $false
          function Invoke-Test($script, $markers) {
            Write-Host ""
            Write-Host "--- $script ---"
            $output = & $cs --import-path cpp\test\cxx_import $script 2>&1
            $output | ForEach-Object { Write-Host "$_" }
            foreach ($m in $markers) {
              if ($output -join "`n" -match [regex]::Escape($m)) {
                Write-Host "  -> PASS ($m)"
              } else {
                Write-Host "  -> FAIL (missing '$m')"
                $script:fail = $true
              }
            }
          }
          Invoke-Test cpp\test\scripts\test_cni_add_language.csc @("Failed 0")
          Invoke-Test cpp\test\scripts\test_partial_parser.csc @("PARTIAL PARSER OK", "CLEAR HOOK OK")
          Invoke-Test cpp\test\scripts\test_typeid.csc @("TYPEID OK")
          if ($fail) {
            Write-Host ""
            Write-Host "=== SOME CNI SCRIPT TESTS FAILED ==="
            exit 1
          }
          Write-Host ""
          Write-Host "=== All CNI script tests passed ==="
